name: guru-yt-probe-gemini
on:
  workflow_dispatch: {}
  push:
    branches: [yt-probe]
    paths:
      - ".github/workflows/guru_yt_probe_gemini.yml"
      - "guru_yt/probe/gemini_probe.py"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests rapidfuzz
      - name: Probe Gemini YouTube input
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python guru_yt/probe/gemini_probe.py
      - name: Commit result
        run: |
          git config user.name "guru-yt-bot"
          git config user.email "guru-yt-bot@users.noreply.github.com"
          git add guru_yt/probe/gemini_probe.json
          git commit -m "gemini probe result" || exit 0
          git pull --rebase && git push

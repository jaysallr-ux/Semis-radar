name: semis-radar-backtest

# 수동 실행 전용. Actions 탭 → semis-radar-backtest → Run workflow → 브랜치 선택.
# (Run workflow 버튼은 이 파일이 main 에 있어야 뜸. main 머지 전 브랜치에서는
#  .github/backtest-trigger.txt 내용을 바꿔 푸시하면 그 브랜치에서 실행됨, grid 없이)
# 결과(backtest/*.csv, summary.json, report.txt)를 실행한 브랜치에 커밋한다.
on:
  workflow_dispatch:
    inputs:
      grid:
        description: "그리드 + LOCO 도 돌릴지 (오래 걸림)"
        type: boolean
        default: false
  push:
    paths:
      - ".github/backtest-trigger.txt"

permissions:
  contents: write

concurrency:
  group: semis-radar-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Backtest
        env:
          TZ: Asia/Seoul
        run: |
          set -o pipefail
          if [ "${{ inputs.grid }}" = "true" ]; then
            python backtest.py --provider naver --grid | tee backtest/report.txt
          else
            python backtest.py --provider naver | tee backtest/report.txt
          fi

      - name: Commit results
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          git add backtest/
          git commit -m "backtest $(date +'%Y-%m-%d %H:%M') (${GITHUB_REF_NAME})" || echo "변경 없음"
          git pull --rebase
          git push

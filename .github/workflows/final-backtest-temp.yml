name: semis-radar-final-backtest-temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-backtest-temp.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run final selected parameters
        env:
          TZ: Asia/Seoul
        run: python backtest.py --provider naver
      - name: Commit final backtest summary
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          git add backtest/summary.json backtest/daily_states.csv
          git commit -m "final selected-parameter backtest" || echo "변경 없음"
          git pull --rebase
          git push

name: semis-radar-backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run | grid | suggest"
        required: true
        default: "grid"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run backtest
        env:
          TZ: Asia/Seoul
        run: |
          case "${{ github.event.inputs.mode }}" in
            suggest) python backtest.py --provider naver --suggest-list-dates ;;
            run)     python backtest.py --provider naver ;;
            *)       python backtest.py --provider naver --grid ;;
          esac
      - name: Commit backtest results
        if: ${{ github.event.inputs.mode != 'suggest' }}
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          git add backtest/
          git commit -m "backtest v3 ${{ github.event.inputs.mode }}" || echo "변경 없음"
          git pull --rebase
          git push

name: semis-radar-opportunity-diagnostic-temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opportunity-diagnostic-temp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Cycle opportunity diagnostic
        env:
          TZ: Asia/Seoul
        run: |
          python - <<'PY'
          import datetime as dt, os, numpy as np, pandas as pd
          import backtest as bt
          from data_provider import get_provider, check_coverage
          from regime import prepare, run_engine

          H=os.getcwd(); start=dt.date(2015,1,1); end=dt.date.today()
          u=bt.load(os.path.join(H,'universe.json')); p=bt.load(os.path.join(H,'params.json'))
          prov=get_provider('naver'); prices={}
          for s in u['stocks']:
              prices[s['ticker']]=prov.get_stock_ohlcv(s['ticker'], start, end)
          kospi=prov.get_index_ohlcv(u['benchmark']['index'], start, end)
          ok,bad,report,suggest=check_coverage(prices,u,start,require_all=True)
          if not ok: raise SystemExit('\n'.join(bad))
          prep=prepare(u,prices,kospi,p,start=start); days=run_engine(prep,p)
          x=prep['ew_index']; dates=prep['dates']; cycles=bt.auto_cycles(x,dates)
          pool,fwd_all,mae_all=bt.baseline(x,days); med=float(np.median(fwd_all))
          print(f'GLOBAL_FWD120_MEDIAN={med*100:.2f}%')
          print('cycle,start,window_days,quality_pass,pass_rate,fwd120_mean,mae60_mean')
          for c in cycles:
              lo=max(0,c['start_i']-bt.PRE_TD); hi=min(len(x)-1,c['start_i']+bt.DETECT_AFTER_TD)
              vals=[]
              for i in range(lo,hi+1):
                  if days[i]['phase']=='HOLD' or i+bt.QUALITY['fwd_window']>=len(x): continue
                  f,_,_=bt.path_stats(x,i,bt.QUALITY['fwd_window'])
                  _,m,_=bt.path_stats(x,i,bt.QUALITY['mae_window'])
                  vals.append((i,f,m,(m>=bt.QUALITY['mae_floor'] and f>=med)))
              n=len(vals); q=sum(v[3] for v in vals)
              fm=np.mean([v[1] for v in vals])*100 if n else float('nan')
              mm=np.mean([v[2] for v in vals])*100 if n else float('nan')
              print(f"{c['name']},{c['start']},{n},{q},{(q/n if n else 0):.3f},{fm:.1f},{mm:.1f}")
              if c['name'] in ('A1','A2'):
                  good=[dates[v[0]].date().isoformat() for v in vals if v[3]]
                  print(f"{c['name']}_GOOD_DATES={','.join(good)}")
          PY

name: semis-radar-package-latest-temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-latest-temp.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build latest zip
        run: |
          python - <<'PY'
          import subprocess, zipfile
          out='Semis-radar-latest.zip'
          files=subprocess.check_output(['git','ls-files'], text=True).splitlines()
          files=[p for p in files if p != '.github/workflows/package-latest-temp.yml']
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p,p)
          print(out, len(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semis-radar-latest
          path: Semis-radar-latest.zip
          retention-days: 1

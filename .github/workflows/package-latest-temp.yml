name: semis-radar-package-latest-temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-latest-temp.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build latest zip
        run: |
          python - <<'PY'
          import os, zipfile
          out='Semis-radar-latest.zip'
          exclude={'.git', '.github/workflows/package-latest-temp.yml', out}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if os.path.join(root,d).lstrip('./') != '.git']
                  for f in files:
                      p=os.path.join(root,f).lstrip('./')
                      if p in exclude or p.startswith('.git/'):
                          continue
                      z.write(p,p)
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semis-radar-latest
          path: Semis-radar-latest.zip
          retention-days: 1

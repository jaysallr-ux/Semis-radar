name: top-detector-research

on:
  workflow_dispatch:
  push:
    branches: [top-detector-research]
    paths:
      - "backtest_top.py"
      - "top.py"
      - "params_top.json"
      - ".github/workflows/top-research.yml"

permissions:
  contents: write

concurrency:
  group: top-detector-research
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: top-detector-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run frozen TOP backtest
        run: python backtest_top.py
      - name: Commit research result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_top/result.json backtest_top/events.csv
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record frozen TOP detector backtest result"
            git push
          fi

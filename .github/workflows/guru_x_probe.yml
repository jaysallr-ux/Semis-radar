name: guru-x-probe

on:
  workflow_dispatch: {}
  push:
    paths:
      - "guru_x/probe.py"
      - ".github/workflows/guru_x_probe.yml"

permissions:
  contents: write

concurrency:
  group: guru-x
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python guru_x/probe.py
      - name: Commit probe result
        run: |
          git config user.name "guru-x-bot"
          git config user.email "guru-x-bot@users.noreply.github.com"
          git add guru_x/data/probe.json
          git commit -m "guru-x probe $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

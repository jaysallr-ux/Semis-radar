name: naver-smoke

on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test Naver chart endpoint
        run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          url='https://fchart.stock.naver.com/sise.nhn?symbol=000660&timeframe=day&count=5&requestType=0'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (semis-radar-smoke)'})
          with urllib.request.urlopen(req, timeout=10) as r:
              data=r.read()
              print('content-type=', r.headers.get('content-type'))
          print('prefix=', data[:120])
          text=data.decode('euc-kr')
          root=ET.fromstring(text)
          rows=[x.get('data') for x in root.iter('item')]
          print('rows=', len(rows))
          print('last=', rows[-1] if rows else None)
          if not rows:
              raise SystemExit('no rows')
          PY

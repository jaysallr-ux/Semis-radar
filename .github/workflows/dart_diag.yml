name: semis-radar-dart-diag

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/dart-diag-trigger.txt"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Diag
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python research/pit/dart_diag.py $(head -n1 .github/dart-diag-trigger.txt)
      - name: Commit
        if: always()
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          git add research/pit/classification/diag/
          git commit -m "dart diag" || echo "변경 없음"
          git pull --rebase
          git push

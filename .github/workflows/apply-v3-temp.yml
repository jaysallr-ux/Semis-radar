name: apply-semis-radar-v3-temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v3-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3 code patch
        run: |
          cat _v3patch_00.b64 _v3patch_01.b64 _v3patch_02.b64 _v3patch_03.b64 | base64 -d | gzip -dc > /tmp/v3.patch
          git apply --check /tmp/v3.patch
          git apply /tmp/v3.patch
          # GitHub Actions token은 workflow 파일 수정 push 권한이 없으므로 이 파일만 원복.
          git checkout -- .github/workflows/final-backtest-temp.yml
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          git add README.md backtest.py data_provider.py params.json regime.py run_daily.py
          git commit -m "Apply semis-radar v3 code"
          git pull --rebase
          git push

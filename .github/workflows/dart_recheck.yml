name: semis-radar-dart-recheck

# 3차 누락 점검 + 다운로드 실패 재확보. .github/dart-recheck-trigger.txt 를 바꿔 푸시하면 실행
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/dart-recheck-trigger.txt"

permissions:
  contents: write

concurrency:
  group: semis-radar-dart-scan
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Git identity
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
      - name: Recheck
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python research/pit/dart_recheck.py --workers 4 --max-minutes 300 --push-every-min 10 2>&1 | tee research/pit/classification/scan_recheck_log.txt
      - name: Commit
        if: always()
        run: |
          git add research/pit/classification/
          git commit -m "dart recheck $(date +'%Y-%m-%d %H:%M') run ${GITHUB_RUN_ID}" || echo "변경 없음"
          git pull --rebase
          git push

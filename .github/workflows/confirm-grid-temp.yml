name: semis-radar-confirm-grid-temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/confirm-grid-temp.yml'

permissions:
  contents: write

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Confirm regime grid
        env:
          TZ: Asia/Seoul
        run: |
          python - <<'PY'
          import copy, datetime as dt
          import numpy as np, pandas as pd
          from backtest import load, evaluate, CYCLES, PRE_CYCLE_TD
          from data_provider import get_provider
          from regime import prepare, run_engine

          universe=load('universe.json'); p=load('params.json'); prov=get_provider('naver')
          start=dt.date(2015,1,1); end=dt.date.today(); prices={}
          for s in universe['stocks']:
              try: prices[s['ticker']]=prov.get_stock_ohlcv(s['ticker'], start, end)
              except Exception as e: print('FAIL', s['name'], e)
          kospi=prov.get_index_ohlcv(universe['benchmark']['index'], start, end)
          prep=prepare(universe, prices, kospi, p); dates=prep['dates']

          allowed=np.zeros(len(dates),dtype=bool); prev_end=-1
          for cyc in CYCLES:
              si=int(np.searchsorted(dates,pd.Timestamp(cyc['start'])))
              ei=len(dates)-1 if cyc['end'] is None else int(np.searchsorted(dates,pd.Timestamp(cyc['end']),side='right'))-1
              pre=max(1,si-PRE_CYCLE_TD,prev_end+1); allowed[pre:ei+1]=True; prev_end=max(prev_end,ei)
          off=~allowed

          def longest_false_streak(active, allowed):
              best=cur=0
              for a,ok in zip(active,allowed):
                  if (not ok) and a: cur+=1; best=max(best,cur)
                  else: cur=0
              return best

          rows=[]
          for enter in [0.40,0.50,0.60,0.70,0.80]:
            for parts in [3,4,5]:
              for exitv in [0.25,0.35,0.45]:
                q=copy.deepcopy(p)
                q['early_enter_breadth']=0.35; q['new_turn_window']=5
                q['confirm_enter_on_share']=enter; q['confirm_min_parts']=parts; q['confirm_exit_on_share']=exitv
                days=run_engine(prep,q); r=evaluate(prep,days)
                active=np.array([d['phase'] in ('EARLY','CONFIRMED') for d in days])
                off_days=int(off.sum()); off_active=int((active & off).sum())
                rows.append({'confirm_enter_on_share':enter,'confirm_min_parts':parts,'confirm_exit_on_share':exitv,
                             'cycle_detected':r['cycle_detected'],'avg_cycle_lag_td':r['avg_cycle_start_lag_td'],
                             'off_cycle_entries':len(r['off_cycle_false_positives']),
                             'off_active_days':off_active,'off_active_share':round(off_active/off_days,3) if off_days else 0,
                             'longest_off_active_streak':longest_false_streak(active,allowed),'entries':r['n_entries']})
          g=pd.DataFrame(rows).sort_values(['cycle_detected','off_active_share','off_cycle_entries','longest_off_active_streak'],ascending=[False,True,True,True])
          g.to_csv('backtest/confirm_grid.csv',index=False,encoding='utf-8-sig')
          print(g.to_string(index=False))
          PY
      - name: Commit confirm grid
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          git add backtest/confirm_grid.csv
          git commit -m "confirm regime threshold grid" || echo "변경 없음"
          git pull --rebase
          git push

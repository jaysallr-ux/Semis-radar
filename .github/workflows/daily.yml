name: semis-radar-daily

on:
  schedule:
    # GitHub scheduled runs can be delayed or occasionally dropped.
    # Retry every 20 minutes from KST 16:10 through 17:50 on weekdays.
    # Freshness guard makes later attempts no-ops after one successful same-day run.
    - cron: "10 7 * * 1-5"  # KST 16:10
    - cron: "30 7 * * 1-5"  # KST 16:30
    - cron: "50 7 * * 1-5"  # KST 16:50
    - cron: "10 8 * * 1-5"  # KST 17:10
    - cron: "30 8 * * 1-5"  # KST 17:30
    - cron: "50 8 * * 1-5"  # KST 17:50
  workflow_dispatch: {}
  # Pipeline repairs should immediately exercise the repaired pipeline.
  push:
    paths:
      - ".github/workflows/daily.yml"
      - "run_daily.py"
      - "oos_tracker.py"
      - "data_provider.py"
      - "regime.py"
      - "params.json"
      - "universe.json"
      - "oos_evaluation_policy.json"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: semis-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Freshness guard
        id: guard
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          run = True
          p = Path("output/latest.json")
          if p.exists():
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
                  ts = d.get("generated_at")
                  if ts:
                      generated = datetime.fromisoformat(ts).astimezone(ZoneInfo("Asia/Seoul")).date()
                      today = datetime.now(ZoneInfo("Asia/Seoul")).date()
                      if generated == today and d.get("data_ok") is True:
                          run = False
              except Exception:
                  run = True
          print(f"run={'true' if run else 'false'}")
          PY

      - name: Install
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run radar
        if: steps.guard.outputs.run == 'true'
        env:
          TZ: Asia/Seoul
        run: python run_daily.py --provider naver

      - name: Update frozen OOS log and score matured alerts
        if: steps.guard.outputs.run == 'true'
        env:
          TZ: Asia/Seoul
        run: python oos_tracker.py --provider naver

      - name: Commit results
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          git add output/
          git commit -m "radar $(date +'%Y-%m-%d %H:%M')" || echo "변경 없음"
          git pull --rebase
          git push

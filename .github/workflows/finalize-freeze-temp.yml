name: semis-radar-finalize-freeze-temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-freeze-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Rebuild backtest with frozen params
        env:
          TZ: Asia/Seoul
        run: python backtest.py --provider naver
      - name: Build clean operational baseline
        env:
          TZ: Asia/Seoul
        run: |
          rm -rf /tmp/semis-frozen-output
          python run_daily.py --provider naver --outdir /tmp/semis-frozen-output
          cp /tmp/semis-frozen-output/latest.json output/latest.json
      - name: Commit frozen results
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          git add backtest/summary.json backtest/signals_auto.csv backtest/signals_manual.csv backtest/daily_states.csv output/latest.json
          git commit -m "freeze 25-10 radar baseline" || echo "변경 없음"
          git pull --rebase
          git push

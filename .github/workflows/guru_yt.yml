name: guru-yt-feed
run-name: guru-yt ${{ (github.event_name == 'workflow_dispatch' && inputs.mode) || (github.event.schedule == '20,50 * * * *' && 'discover') || 'full' }}

on:
  schedule:
    # GPT Macro Guru Stance Watch runs at 11:00 and 22:00 KST.
    # Collect 50 minutes earlier with one retry 20 minutes later. The guard skips the retry
    # if a run already happened in the last 50 minutes.
    - cron: "10 1 * * *"   # KST 10:10
    - cron: "30 1 * * *"   # KST 10:30
    - cron: "10 12 * * *"  # KST 21:10
    - cron: "30 12 * * *"  # KST 21:30
    # Discovery only (RSS, free, no captions or Gemini) every 30 minutes, because RSS shows only the
    # latest 15 uploads and high-volume channels (CNBC, Yahoo, Schwab) can push older ones out between full runs.
    - cron: "20,50 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full or discover"
        default: "full"
  push:
    paths:
      - ".github/workflows/guru_yt.yml"
      - "guru_yt/collect_yt.py"
      - "guru_yt/channels.json"

permissions:
  contents: write

concurrency:
  group: guru-yt
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Always start from the latest main, not the commit that triggered the run. A run that waited in
          # the concurrency queue would otherwise start from stale data and fail to push its feed.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Freshness guard
        id: guard
        shell: bash
        env:
          SCHED: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          # GitHub schedules can arrive hours late. dispatch-tick (cron-job.org) runs the slots on time, so a
          # scheduled run is skipped if the slot it belongs to has already been covered.
          KST = ZoneInfo("Asia/Seoul")
          now = datetime.now(KST)
          def ts(path, key):
              try:
                  return datetime.fromisoformat(json.loads(Path(path).read_text(encoding="utf-8"))[key])
              except Exception:
                  return None
          def latest_slot(slots):
              cands = [now.replace(hour=h, minute=m, second=0, microsecond=0) - timedelta(days=d)
                       for d in (0, 1) for h, m in slots]
              return max(c for c in cands if c <= now)
          run = True
          mode = "discover" if (os.environ.get("SCHED") == "20,50 * * * *" or os.environ.get("INPUT_MODE") == "discover") else "full"
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              if mode == "full":
                  gen = ts("guru_yt/data/youtube_feed.json", "generated_at")
                  if gen and gen >= latest_slot([(10, 10), (21, 10)]) - timedelta(minutes=10):
                      run = False
              else:
                  last = ts("guru_yt/data/discovered.json", "last_checked_at")
                  if last and now - last < timedelta(minutes=20):
                      run = False
          print(f"run={'true' if run else 'false'}")
          print(f"mode={mode}")
          PY

      - name: Restore private caption cache
        if: steps.guard.outputs.run == 'true' && steps.guard.outputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: guru_yt/cache
          key: guru-yt-captions-${{ github.run_id }}
          restore-keys: guru-yt-captions-

      - name: Install
        if: steps.guard.outputs.run == 'true'
        run: pip install requests rapidfuzz

      - name: Collect YouTube
        if: steps.guard.outputs.run == 'true'
        env:
          YT_TRANSCRIPT_KEY: ${{ secrets.YT_TRANSCRIPT_KEY }}
          SUPADATA_KEY: ${{ secrets.SUPADATA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ steps.guard.outputs.mode }}" = "discover" ]; then
            python guru_yt/collect_yt.py --discover
          else
            python guru_yt/collect_yt.py
          fi

      - name: Save private caption cache
        if: always() && steps.guard.outputs.run == 'true' && steps.guard.outputs.mode == 'full'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: guru_yt/cache
          key: guru-yt-captions-${{ github.run_id }}

      - name: Commit feed
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "guru-yt-bot"
          git config user.email "guru-yt-bot@users.noreply.github.com"
          git add guru_yt/data/
          git commit -m "guru-yt ${{ steps.guard.outputs.mode }} $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')" || { echo "변경 없음"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

name: woocharts-test

on:
  push:
    branches:
      - woocharts-test
    paths:
      - "woocharts/fetch.py"
      - "woocharts/probe_sources.py"
      - "woocharts/probe_coc.py"
      - "woocharts/probe_exchanges.py"
      - "woocharts/probe_equities.py"
      - "woocharts/probe_sec.py"
      - ".github/workflows/woocharts_test.yml"

permissions:
  contents: write

concurrency:
  group: woocharts-test
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests numpy
      - run: python woocharts/fetch.py
      - run: python woocharts/probe_sources.py
      - run: python woocharts/probe_coc.py
      - run: python woocharts/probe_exchanges.py
      - run: python woocharts/probe_equities.py
      - run: python woocharts/probe_sec.py
      - name: Commit result
        run: |
          git config user.name "woocharts-bot"
          git config user.email "woocharts-bot@users.noreply.github.com"
          git add woocharts/data
          git commit -m "woocharts research fetch $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')" || exit 0
          git push origin HEAD:woocharts-test

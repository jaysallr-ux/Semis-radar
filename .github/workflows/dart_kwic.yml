name: semis-radar-dart-kwic

# 빠른 제외 트랙 근거(KWIC) 수집. .github/dart-kwic-trigger.txt 를 바꿔 푸시하면 실행
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/dart-kwic-trigger.txt"

permissions:
  contents: write

concurrency:
  group: semis-radar-dart-scan
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: KWIC
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python research/pit/dart_kwic.py --workers 4 2>&1 | tee research/pit/classification/kwic_log.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          git add research/pit/classification/
          git commit -m "dart kwic $(date +'%Y-%m-%d %H:%M') run ${GITHUB_RUN_ID}" || echo "변경 없음"
          git pull --rebase
          git push

name: semis-radar-grid-extended-temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grid-extended-temp.yml'

permissions:
  contents: write

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Extended threshold grid
        env:
          TZ: Asia/Seoul
        run: |
          python - <<'PY'
          import copy, datetime as dt, os
          import pandas as pd
          from backtest import load, evaluate
          from data_provider import get_provider
          from regime import prepare, run_engine

          universe=load('universe.json'); p=load('params.json'); prov=get_provider('naver')
          start=dt.date(2015,1,1); end=dt.date.today(); prices={}
          for s in universe['stocks']:
              try: prices[s['ticker']]=prov.get_stock_ohlcv(s['ticker'], start, end)
              except Exception as e: print('FAIL', s['name'], e)
          kospi=prov.get_index_ohlcv(universe['benchmark']['index'], start, end)
          prep=prepare(universe, prices, kospi, p)
          rows=[]
          for ebr in [0.30,0.35,0.40,0.45,0.50,0.55,0.60]:
              for w in [3,5,7,10,15]:
                  q=copy.deepcopy(p); q['early_enter_breadth']=ebr; q['new_turn_window']=w
                  r=evaluate(prep, run_engine(prep,q))
                  rows.append({'early_enter_breadth':ebr,'new_turn_window':w,
                               'cycle_detected':r['cycle_detected'],'avg_cycle_lag_td':r['avg_cycle_start_lag_td'],
                               'entries':r['n_entries'],'off_cycle_false_pos':len(r['off_cycle_false_positives'])})
          g=pd.DataFrame(rows)
          g.to_csv('backtest/grid_extended.csv',index=False,encoding='utf-8-sig')
          print(g.to_string(index=False))
          PY
      - name: Commit extended grid
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          git add backtest/grid_extended.csv
          git commit -m "extended threshold grid" || echo "변경 없음"
          git pull --rebase
          git push

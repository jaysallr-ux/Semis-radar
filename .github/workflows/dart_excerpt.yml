name: semis-radar-dart-excerpt

# 검토용 발췌. classification/excerpt_request.csv 의 문서를 받아 excerpts/ 에 커밋.
# .github/dart-excerpt-trigger.txt 를 바꿔 푸시하면 실행
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/dart-excerpt-trigger.txt"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Excerpt
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          python research/pit/dart_excerpt.py --list research/pit/classification/excerpt_request.csv --workers 4 > excerpt.log 2>&1 &
          PID=$!
          # 10분마다 중간 커밋: 끊겨도 저장된 문서는 남고, 재실행 때 이미 있는 파일은 건너뜀
          while kill -0 $PID 2>/dev/null; do
            for i in $(seq 1 60); do kill -0 $PID 2>/dev/null || break; sleep 10; done
            git add research/pit/classification/excerpts/
            git commit -q -m "dart excerpts 중간 저장 $(date +'%H:%M')" || true
            git pull -q --rebase && git push -q || true
          done
          wait $PID; tail -5 excerpt.log
      - name: Commit
        if: always()
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          git add research/pit/classification/excerpts/
          git commit -m "dart excerpts $(date +'%Y-%m-%d %H:%M')" || echo "변경 없음"
          git pull --rebase
          git push

name: kospi-pbr-probe
on:
  workflow_dispatch: {}
  push:
    paths:
      - "kospi_pbr/probe_login.py"
      - ".github/workflows/kospi_pbr_probe.yml"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python kospi_pbr/probe_login.py

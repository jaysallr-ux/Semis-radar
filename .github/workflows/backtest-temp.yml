name: semis-radar-backtest-temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backtest-temp.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Run historical grid
        env:
          TZ: Asia/Seoul
        run: python backtest.py --provider naver --grid
      - name: Commit backtest results
        run: |
          git config user.name "semis-radar-bot"
          git config user.email "semis-radar-bot@users.noreply.github.com"
          git add backtest/
          git commit -m "backtest real Naver data" || echo "변경 없음"
          git pull --rebase
          git push

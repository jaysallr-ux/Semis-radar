name: kkeujeok-probe
on:
  push:
    branches: [kkeujeok-probe]
    paths:
      - "kkeujeok/list_probe.py"
      - ".github/workflows/kkeujeok_probe.yml"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python kkeujeok/list_probe.py
      - run: |
          git config user.name "guru-x-bot"
          git config user.email "guru-x-bot@users.noreply.github.com"
          git add kkeujeok/probe.json
          git commit -m "kkeujeok list probe" || exit 0
          git push
